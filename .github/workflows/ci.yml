name: Build and Test

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ ninja-build

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -G Ninja

      - name: Build
        run: cmake --build build --config Release

      - name: Run unit tests
        working-directory: build
        run: ./unit_tests

      - name: Run demo (sanity check)
        working-directory: build
        run: ./demo

      - name: Run benchmark (informational, not a pass/fail gate)
        working-directory: build
        run: ./bench 50000

      - name: Run concurrent demo (Phase 4 pipeline)
        working-directory: build
        run: ./concurrent_demo 50000
